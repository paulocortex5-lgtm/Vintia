# ─────────────────────────────────────────────────────────────────────────────
# Vantia LLM provider registry — task 1.5 (master prompt v4.0)
#
# Adding a provider requires ONLY editing this file (R38). The router
# (engine/llm/router.py) and the client (engine/llm/client.py) are
# provider-agnostic.
#
# Schema
#   id            : stable machine id; used in logs, quotas, cost ledger
#   display       : human-readable name
#   tier          : free | paid
#                     paid entries are skipped unless VANTIA_ALLOW_PAID_LLM=1
#                     (R27: free providers are exhausted in order first)
#   base_url      : full chat endpoint; {model} / {account_id} / {project} /
#                     {region} placeholders are expanded from url_vars
#   url_vars      : {placeholder: ENV_VAR} — value read at call time;
#                     an empty value ("" ) means "fill with the selected
#                     model id" (used for the {model} placeholder)
#   query_params  : {name: ENV_VAR} — extra URL query params, same "" rule
#   api_key_env   : env var holding the credential; "" = no key required
#   auth_header   : "Bearer {key}" style template, or null
#   api_key_header: for providers that authenticate via a plain header
#                     (e.g. x-api-key); mutually exclusive with auth_header
#   extra_headers : static request headers sent on every call
#   payload_style : openai | gemini | anthropic | cohere
#   limits        : rpm / rpd — enforced by engine/llm/quota.py
#   models        : list; models[0] is the default. per-1M-token USD pricing
#                     (0 = free tier), `ctx` = context window, `max_tokens`
#                     = default output cap
#
# CHAIN ORDER = ORDER IN THIS FILE. Free block first, paid block second.
# ─────────────────────────────────────────────────────────────────────────────
version: "1.0"

