[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantia"
version = "0.4.0"
description = "Vantia — Universal Opportunity Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vantia", email = "agent@vantia.local" }]
keywords = ["jobs", "scholarships", "ats", "visa", "opportunity-engine"]
dependencies = [
  "click>=8.1",
  "pydantic>=2.6",
  "jsonschema>=4.21",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "requests>=2.31",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "pycountry>=23.12",
  "tenacity>=8.2",
  "supabase>=2.4",
]

[project.optional-dependencies]
ats = ["pdfplumber>=0.11", "python-docx>=1.1"]
payments = ["stripe>=8.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "responses>=0.25",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
vantia = "engine.cli:main"

[project.urls]
Homepage = "https://github.com/paulocortex5-lgtm/Vintia"
Repository = "https://github.com/paulocortex5-lgtm/Vintia"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
