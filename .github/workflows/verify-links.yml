name: Verify Job Links
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m engine.sources.verify_links --batch-size 500
        env:
          SUPABASE_URL: ${{ secrets.VANTIA_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VANTIA_SUPABASE_SERVICE_KEY }}
