name: Sponsor reliability
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m engine.sources.sponsor_reliability
        env:
          SUPABASE_URL: ${{ secrets.VANTIA_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VANTIA_SUPABASE_SERVICE_KEY }}
